<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <title>One conversation turn</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#5F5E5A"/>
    </marker>
  </defs>
  <rect width="960" height="620" fill="#FFFFFF"/>

  <!-- lane headers -->
  <g font-size="14" font-weight="600" text-anchor="middle">
    <rect x="20" y="20" width="160" height="34" rx="6" fill="#E6F1FB" stroke="#185FA5"/><text x="100" y="42" fill="#0C447C">Frontend</text>
    <rect x="220" y="20" width="200" height="34" rx="6" fill="#EEEDFE" stroke="#534AB7"/><text x="320" y="42" fill="#26215C">Backend</text>
    <rect x="460" y="20" width="160" height="34" rx="6" fill="#FAEEDA" stroke="#854F0B"/><text x="540" y="42" fill="#412402">Groq</text>
    <rect x="660" y="20" width="160" height="34" rx="6" fill="#E1F5EE" stroke="#0F6E56"/><text x="740" y="42" fill="#04342C">Hindsight</text>
    <rect x="840" y="20" width="100" height="34" rx="6" fill="#F1EFE8" stroke="#5F5E5A"/><text x="890" y="42" fill="#2C2C2A">SQLite</text>
  </g>
  <g stroke="#D3D1C7" stroke-dasharray="4 4">
    <line x1="100" y1="54" x2="100" y2="590"/><line x1="320" y1="54" x2="320" y2="590"/>
    <line x1="540" y1="54" x2="540" y2="590"/><line x1="740" y1="54" x2="740" y2="590"/><line x1="890" y1="54" x2="890" y2="590"/>
  </g>

  <g font-size="12.5" fill="#2C2C2A" stroke-width="1.6">
    <line x1="100" y1="90" x2="318" y2="90" stroke="#5F5E5A" marker-end="url(#a)"/>
    <text x="110" y="82">1. POST /message {text, memory_enabled}</text>

    <line x1="320" y1="135" x2="538" y2="135" stroke="#5F5E5A" marker-end="url(#a)"/>
    <text x="330" y="127">2. extract IOCs (strict JSON)</text>
    <line x1="540" y1="160" x2="322" y2="160" stroke="#5F5E5A" stroke-dasharray="5 3" marker-end="url(#a)"/>
    <text x="330" y="176" fill="#5F5E5A">UPI, phone, alias, case no., stage</text>

    <line x1="320" y1="205" x2="888" y2="205" stroke="#5F5E5A" marker-end="url(#a)"/>
    <text x="560" y="197">3. upsert IOCs + edges</text>

    <rect x="232" y="225" width="610" height="150" rx="8" fill="#E1F5EE" fill-opacity="0.45" stroke="#0F6E56" stroke-dasharray="6 4"/>
    <text x="830" y="243" text-anchor="end" font-size="12" font-weight="600" fill="#0F6E56">only when memory_enabled = true</text>
    <line x1="320" y1="265" x2="738" y2="265" stroke="#0F6E56" marker-end="url(#a)"/>
    <text x="330" y="257">4. recall(query = message + IOCs)</text>
    <line x1="740" y1="290" x2="322" y2="290" stroke="#0F6E56" stroke-dasharray="5 3" marker-end="url(#a)"/>
    <text x="440" y="306" fill="#0F6E56">past aliases, case numbers, mule accounts</text>
    <text x="330" y="345">5. contradiction check: current claims vs recalled facts</text>
    <text x="330" y="362" fill="#5F5E5A">e.g. same UPI under a different alias, new case no. for same officer</text>

    <line x1="320" y1="405" x2="538" y2="405" stroke="#5F5E5A" marker-end="url(#a)"/>
    <text x="330" y="397">6. Ajji reply (persona + memories)</text>
    <line x1="540" y1="430" x2="322" y2="430" stroke="#5F5E5A" stroke-dasharray="5 3" marker-end="url(#a)"/>
    <text x="330" y="446" fill="#5F5E5A">stalls, probes contradictions, fake data only</text>

    <line x1="320" y1="480" x2="738" y2="480" stroke="#0F6E56" marker-end="url(#a)"/>
    <text x="330" y="472">7. retain(message, context, timestamp)</text>
    <text x="330" y="496" fill="#5F5E5A">always runs, so the baseline still builds memory</text>

    <line x1="320" y1="545" x2="102" y2="545" stroke="#5F5E5A" stroke-dasharray="5 3" marker-end="url(#a)"/>
    <text x="110" y="537">8. reply + recalled memories</text>
    <text x="110" y="562" fill="#5F5E5A">+ IOCs + contradiction flags</text>
  </g>
</svg>
